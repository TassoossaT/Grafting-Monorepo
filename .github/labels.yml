# GitHub Labels Taxonomy for Grafting Monorepo
# Used to categorize Issues and Pull Requests across GitHub Projects

# --- Item Types (Type) ---
- name: "type: task"
  color: "0E8A16" # Green
  description: "Technical task or feature implementation"

- name: "type: refinement"
  color: "1D76DB" # Blue
  description: "Technical refinement, RFC, spike, or architecture specification"

- name: "type: chore"
  color: "FBCA04" # Yellow
  description: "Maintenance, dependencies, tooling, scripts, or internal refactoring"

- name: "type: bug"
  color: "D93F0B" # Red
  description: "Unexpected behavior, test failure, crash, or contract breakage"

- name: "type: epic"
  color: "5319E7" # Purple
  description: "High-level initiative composed of multiple tasks and refinements"

# --- Workflow Status (Status) ---
- name: "status: triage"
  color: "EDEDED" # Light Gray
  description: "Newly created item awaiting initial triage"

- name: "status: refinement"
  color: "BFD4F2" # Light Blue
  description: "Under active technical discussion, spike, or contract definition"

- name: "status: ready-for-dev"
  color: "0052CC" # Dark Blue
  description: "Refined, scoped, and ready to be picked up for development"

- name: "status: in-progress"
  color: "FEF2C0" # Light Yellow
  description: "Under active implementation"

- name: "status: in-review"
  color: "D4C5F9" # Light Purple
  description: "Pull Request opened awaiting review and verification"

- name: "status: blocked"
  color: "B60205" # Dark Red
  description: "Blocked by external dependency or pending architectural decision"

- name: "status: done"
  color: "0E8A16" # Green
  description: "Completed, verified, and merged into master"

# --- Priority (Priority) ---
- name: "priority: P0-critical"
  color: "B60205" # Dark Red
  description: "Critical / Blocker (requires immediate action)"

- name: "priority: P1-high"
  color: "D93F0B" # Dark Orange
  description: "High priority for the current iteration"

- name: "priority: P2-medium"
  color: "FBCA04" # Yellow
  description: "Normal priority"

- name: "priority: P3-low"
  color: "C2E0C6" # Light Green
  description: "Low priority / Nice to have"

# --- Subsystems & Modules (Area) ---
- name: "area: graph-core"
  color: "006B75"
  description: "libs/graph (grafting-graph-core, graph-ir)"

- name: "area: engine"
  color: "0052CC"
  description: "libs/engine (simulation, physics, query)"

- name: "area: isekai"
  color: "5319E7"
  description: "libs/isekai, packages/isekai-web-client, dotnet interoperability"

- name: "area: domains"
  color: "0E8A16"
  description: "libs/domains (procgen, vtt-domains)"

- name: "area: apps"
  color: "F9D0C4"
  description: "apps/architecture-studio, apps/vtt"

- name: "area: tooling"
  color: "C5DEF5"
  description: "tools/ia-graft, automation scripts, and validation tooling"

- name: "area: docs"
  color: "BFD4F2"
  description: "GRAFTING_MASTER_SOURCE.md, ADRs, specs, and architectural documentation"

- name: "area: ci-cd"
  color: "E99695"
  description: "GitHub Actions workflows and release automations"
