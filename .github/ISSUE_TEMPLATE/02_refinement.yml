name: "🔍 Technical Refinement / RFC / Spike"
description: "Architecture discussion, technical spike, trade-off evaluation, or contract definition before coding."
title: "[Refine]: "
labels: ["type: refinement", "status: refinement"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🧠 Technical Refinement & Architecture Spike
        Use this form to document technical discussions, spikes, and contract designs.
        The goal of refinement is to resolve open questions and convert the problem into actionable tasks (`Ready for Dev`).

  - type: textarea
    id: problem_statement
    attributes:
      label: "❓ Problem Statement"
      description: "What architectural, technical, or product problem are we solving? What is the current limitation?"
      placeholder: "e.g. We need to synchronize simulation state between Web and native clients with sub-16ms latency without duplicating physics calculations..."
    validations:
      required: true

  - type: textarea
    id: proposed_design
    attributes:
      label: "📐 Proposed Design & Alternatives Considered"
      description: "What approaches were analyzed? What is the recommended design and what are the trade-offs?"
      placeholder: "Option A: FlatBuffers over WebSocket with delta compression\nOption B: WebTransport binary streams\nTrade-offs in memory consumption and browser compatibility..."
    validations:
      required: true

  - type: dropdown
    id: architectural_impact
    attributes:
      label: "🏛️ Architectural Impact"
      description: "Level of impact on the monorepo architecture and decisions."
      options:
        - "Requires new ADR or modification of an OPEN decision gate (docs/adr/)"
        - "FlatBuffers contract change / Cross-runtime ABI addition"
        - "New package in packages/* or crate in libs/*"
        - "Internal refactoring without public contract breakage"
        - "Exploratory spike in apps/architecture-studio/lab"
    validations:
      required: true

  - type: textarea
    id: open_questions
    attributes:
      label: "🤔 Open Questions & Risks"
      description: "What needs validation or decision before this is ready for development?"
      placeholder: "- What is the maximum acceptable memory footprint on WebAssembly targets?\n- Do we need backward compatibility for v1 schema?"
    validations:
      required: false

  - type: checkboxes
    id: ready_for_dev_checklist
    attributes:
      label: "🚦 'Ready for Dev' Criteria Checklist"
      description: "Check off items as they are resolved during the refinement discussion:"
      options:
        - label: "Scope and package boundaries are clearly bounded"
        - label: "Data contracts / public interfaces are agreed upon"
        - label: "Decisions and trade-offs documented (or ADR drafted)"
        - label: "Acceptance criteria and test strategy defined"
        - label: "Decomposed into actionable implementation tasks ([Task])"
