name: "🐛 Bug Report"
description: "Report unexpected behavior, build failure, contract regression, or test breakage."
title: "[Bug]: "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🐞 Bug Report
        Describe the issue with objective details to facilitate quick reproduction and resolution.

  - type: textarea
    id: summary
    attributes:
      label: "📌 Summary"
      description: "A clear and concise description of what went wrong."
      placeholder: "e.g. FlatBuffers contract generation fails when generating TypeScript bindings..."
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: "🔁 Steps to Reproduce"
      description: "How can the issue be reliably reproduced?"
      placeholder: |
        1. Run command '...'
        2. Inspect output in '...'
        3. Observe error '...'
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: "🎯 Expected vs Actual Behavior"
      description: "What did you expect to happen and what actually happened?"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "⚠️ Severity / Priority"
      options:
        - "P0 - Critical (Broken CI, compilation blocker, pipeline crash)"
        - "P1 - High (Core functionality unavailable without workaround)"
        - "P2 - Medium (Functional defect with existing workaround)"
        - "P3 - Low (Minor inconsistency, cosmetic or logging noise)"
    validations:
      required: true

  - type: textarea
    id: logs_and_context
    attributes:
      label: "📋 Logs, Stacktraces & Terminal Output"
      description: "Paste command output, logs, or error traces here."
      render: shell
    validations:
      required: false
