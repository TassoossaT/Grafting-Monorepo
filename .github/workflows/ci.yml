name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  linux:
    # Master source S2.3: platform-dependent artifacts build on the
    # corresponding system; the normal (non-native) build runs on Linux.
    # Verification is generic across the monorepo using standard workspace
    # targets (Nx run-many, Cargo workspace, script test suite, docs drift check).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        # rust-toolchain.toml pins channel/components/targets; running any
        # cargo/rustup command in the repo root makes rustup install
        # exactly that toolchain.
        run: rustup show

      - name: Install pinned Rustdoc JSON toolchain
        # Public API extraction needs nightly because rustdoc JSON is still
        # unstable. This pin does not replace the repository's authoritative
        # stable Rust toolchain and installation remains a CI setup effect.
        run: rustup toolchain install "$(cat tools/rust-public-api-toolchain.txt)" --profile minimal

      - name: Cache flatc binary
        id: cache-flatc
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/flatc
          key: flatc-${{ runner.os }}-${{ hashFiles('tools/flatc-version.txt') }}

      - name: Install pinned flatc (C-005, master source S10.3)
        run: |
          FLATC_VERSION=$(cat tools/flatc-version.txt)
          if ! command -v flatc &> /dev/null || [ "$(flatc --version | awk '{print $3}')" != "${FLATC_VERSION}" ]; then
            curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL -o /tmp/flatc.zip "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip"
            unzip -o /tmp/flatc.zip -d /tmp/flatc
            chmod +x /tmp/flatc/flatc
            sudo mv /tmp/flatc/flatc /usr/local/bin/flatc
          fi
          flatc --version

      - name: Cache wasm-pack binary
        id: cache-wasm-pack
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ hashFiles('tools/wasm-pack-version.txt') }}

      - name: Install pinned wasm-pack (DEC-055/ADR-0017)
        # libs/isekai/wasm-bridge and libs/domains/procgen/generation-wasm each run
        # `wasm-pack build` from their own package.json `postinstall` --
        # the "Install Node dependencies" step below triggers those, so
        # wasm-pack must already be on PATH before `pnpm install` runs.
        run: |
          WASM_PACK_VERSION=$(cat tools/wasm-pack-version.txt)
          if ! command -v wasm-pack &> /dev/null || [ "$(wasm-pack --version | awk '{print $2}')" != "${WASM_PACK_VERSION}" ]; then
            curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C /tmp
            chmod +x /tmp/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack
            sudo mv /tmp/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
          fi
          wasm-pack --version

      - name: Generate FlatBuffers contracts (C-005/C-006)
        # Generates Rust and TS contracts authoritatively before Node installation
        # so wasm-pack postinstall scripts compile against fresh generated types.
        run: node tools/scripts/generate-contracts.mjs

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Cargo check + test
        run: |
          cargo check --workspace
          cargo test --workspace

      - name: License notices and script behavior tests
        run: |
          pnpm run licenses:third-party-check
          node --test tools/scripts/*.test.mjs

      - name: Generic workspace checks and tests
        # Executes check, test, and api-check across all projects in the monorepo graph
        run: |
          pnpm exec nx run-many --target=check --all
          pnpm exec nx run-many --target=test --all
          pnpm exec nx run-many --target=api-check --all

      - name: Docs, Graph IR, and API baseline validation
        # Regenerates every derived artifact and fails on any difference, rather
        # than running each `--check` in turn.
        #
        # The `--check` scripts report *which file* drifted; this reports *what
        # changed in it*, which is the difference between "signatures-map.md is
        # stale" and a diff a reviewer can act on. `master` went red three times
        # on 2026-08-22 for exactly that message, because nothing regenerates
        # these files and the error named no cause.
        #
        # Regenerating also closes the gap `tools/scripts/README.md` records --
        # `project-graph.json` was never refreshed by anything, so every
        # artifact downstream of it was rebuilt from a stale input. `graph:project`
        # now runs first, inside `docs:generate`.
        #
        # `artifact-manifest.json` is excluded because it is a record of *where
        # it was built*, not a derivation of the sources. Its `target` is the
        # build machine's triple, so this Linux runner and any developer machine
        # disagree by construction; its `gitSha` is `git rev-parse HEAD`, so the
        # committed value is necessarily the sha of the commit before the one
        # that wrote it, and no commit can record its own. Diffing it byte for
        # byte cannot pass, which is what it did from #189 until #194.
        #
        # It is still checked -- by its own `--check`, which compares the fields
        # that carry meaning and skips exactly those two. That is the general
        # rule this step has to respect: a diff reports more than `--check`
        # does, but only `--check` knows which parts of its own output are
        # claims rather than provenance.
        run: |
          pnpm run docs:generate
          if ! git diff --exit-code -- docs/generated ':!docs/generated/artifact-manifest.json'; then
            echo "::error::Generated artifacts are stale. Run 'pnpm run docs:generate' and commit the result."
            exit 1
          fi
          pnpm run graph:manifest:check

      - name: Public API baselines
        # Kept separate from the regeneration above: a baseline is a reviewed
        # contract, never regenerated automatically. Drift here must fail and be
        # updated deliberately (DEC-051).
        run: pnpm exec nx run-many --target=api-check --all

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"

      - name: uv lock check + sync
        run: |
          uv lock --check
          uv sync --locked

      - name: Python tests and AI coordination checks
        run: |
          uv run --package automation pytest
          pnpm run ai:check
