name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  linux:
    # Master source S2.3: platform-dependent artifacts build on the
    # corresponding system; the normal (non-native) build runs on Linux.
    # No Windows/.NET job yet; the root scaffold now exists, so B-010 is
    # actionable but remains a separate task.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        # rust-toolchain.toml pins channel/components/targets; running any
        # cargo/rustup command in the repo root makes rustup install
        # exactly that toolchain.
        run: rustup show

      - name: Install pinned Rustdoc JSON toolchain
        # Public API extraction needs nightly because rustdoc JSON is still
        # unstable. This pin does not replace the repository's authoritative
        # stable Rust toolchain and installation remains a CI setup effect.
        run: rustup toolchain install "$(cat tools/rust-public-api-toolchain.txt)" --profile minimal

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned flatc (C-005, master source S10.3)
        # Rust/TS use this primary pin (tools/flatc-version.txt); C#
        # uses a second, older, separately-pinned flatc instead (see
        # tools/scripts/get-flatc-csharp.ps1) -- irrelevant here, this
        # job doesn't build the C# side. Asset name verified against the
        # real google/flatbuffers GitHub release, not assumed.
        run: |
          FLATC_VERSION=$(cat tools/flatc-version.txt)
          curl -fsSL -o /tmp/flatc.zip "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip"
          unzip -o /tmp/flatc.zip -d /tmp/flatc
          chmod +x /tmp/flatc/flatc
          sudo mv /tmp/flatc/flatc /usr/local/bin/flatc
          flatc --version

      - name: Generate FlatBuffers Rust code (C-005/C-006)
        # A bare `cargo test --workspace` below bypasses Nx's own
        # `dependsOn` codegen chain entirely (that only fires through an
        # `nx run` invocation) -- generate explicitly first. Only the
        # Rust output is needed here; TS/C# generation isn't exercised
        # by this job (no Windows/.NET or Node-typecheck CI job exists
        # yet -- B-010, a separate, already-tracked gap).
        run: flatc --rust -o libs/engine/domain-core/src/generated libs/engine/domain-core/contracts/command.fbs libs/engine/domain-core/contracts/domain_event.fbs libs/engine/domain-core/contracts/snapshot.fbs

      - name: Cargo check + test
        run: |
          cargo check --workspace
          cargo test --workspace

      - name: TypeScript behavior contracts
        run: |
          node --test tools/scripts/agent-task-guard.test.mjs
          pnpm exec nx run x6-canvas:check
          pnpm exec nx run x6-canvas:test
          pnpm exec nx run ui:check
          pnpm exec nx run ui:test
          pnpm exec nx run ui:api-check

      - name: Docs and Graph IR drift check (G-008/I-007)
        # Composes the real repo-map/artifact-manifest/Graph IR extractor
        # --check scripts (G-003/G-004/I-004) with the Rust and TypeScript
        # public-API baseline checks (I-003A/I-003B) into the one entry
        # point master source S7.3 names -- see package.json's docs:check
        # and tools/scripts/README.md. Replaces the two api-check
        # invocations that used to run standalone/bundled above; no
        # coverage removed, just consolidated under one named step.
        run: pnpm run docs:check

      - name: Nx check
        run: pnpm exec nx run engine-domain-core:check

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"

      - name: uv lock check + sync
        run: |
          uv lock --check
          uv sync --locked

      - name: Python tests
        run: uv run --package automation pytest
