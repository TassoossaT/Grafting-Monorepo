<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grafting Architecture Studio</title>
  </head>
  <body data-state="loading">
    <header class="topbar">
      <div class="identity">
        <strong>Grafting Architecture Studio</strong>
        <span id="graph-identity">Loading Graph IR v1…</span>
      </div>
      <div class="toolbar">
        <span>Drag: pan | Click: inspect | Ctrl/Cmd + wheel: zoom</span>
        <span id="graph-counts">Loading…</span>
        <span class="freshness" title="Runtime freshness evidence is not available yet">Unknown freshness</span>
        <button id="center" type="button">Center</button>
        <button id="reset" type="button">Reset view</button>
      </div>
    </header>
    <div class="workspace">
      <aside class="explorer" aria-labelledby="explorer-title">
        <p class="eyebrow">Explorer</p>
        <h1 id="explorer-title">Repository entities</h1>
        <p class="muted">Keyboard-accessible Graph IR v1 nodes and relations.</p>
        <ul id="entity-list" class="entity-list"></ul>
      </aside>
      <main id="graph" data-testid="graph" aria-label="Read-only repository graph canvas"></main>
      <aside class="inspector" aria-label="Selected entity inspector">
        <div id="inspector-content">
          <p class="eyebrow">Inspector</p>
          <h2>Loading…</h2>
        </div>
      </aside>
    </div>
    <footer id="status" data-testid="status" role="status" aria-live="polite">
      Loading Graph IR v1…
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
