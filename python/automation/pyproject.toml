[project]
name = "automation"
version = "0.0.0"
description = "Example uv workspace member proving the Python pipeline (Epic B / Phase 1). Real automation packages land alongside this one as real needs arise."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automation"]
