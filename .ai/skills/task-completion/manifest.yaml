id: task-completion
name: Task completion report
summary: >
  Produces the AGENTS.md completion report and, for a full task, opens its
  pull request via ia-graft so the next session starts from a clean entry
  point.
triggers:
  - a tracked task is marked done
  - the owner signals the work session is ending
  - immediately before a commit that closes out planning/architecture work
risk: low
cost: low
depends_on:
  - AGENTS.md ("Completion format" section)
  - tools/ia-graft (task done/cleanup)
status: active
version: 2.0.0
owner: repository owner
