[package]
name = "grafting-vtt-generation-wasm"
version = "0.0.0"
edition = "2024"
publish = false
description = "Wasm bridge exposing a small, real VTT procedural-generation slice (noise-backed heightmap) to the Architecture Studio's VTT generation-test surface; not the full Townscaper-style generation pipeline."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
noise = "0.9"
getrandom = { version = "0.2", features = ["js"] }
