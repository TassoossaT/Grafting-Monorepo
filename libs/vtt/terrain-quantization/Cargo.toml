[package]
name = "grafting-vtt-terrain-quantization"
version = "0.0.0"
edition = "2024"
publish = false
description = "Wasm bridge quantizing a continuous VTT heightmap (generation-wasm's output) into a discrete stacked-layer elevation grid; pipeline step 3 only, per docs/research/vtt-map-and-terrain-construction-options.md."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
