[package]
name = "grafting-procgen-terrain-quantization"
version = "0.0.0"
edition = "2024"
publish = false
description = "Wasm bridge quantizing a continuous heightmap (generation-wasm's output) into a discrete stacked-layer elevation grid, as a generic, shareable domain capability; currently informed by the VTT map-generation pipeline design in docs/research/vtt-map-and-terrain-construction-options.md, but not exclusive to it."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
