[package]
name = "grafting-procgen-structure-generation"
version = "0.0.0"
edition = "2024"
publish = false
description = "Derives ADR-0022 construction-surface node cycles for walls and door openings from centerline generation parameters. Generation-only: produces Node/Edge/SurfaceSpec data, never mutates a graph or registry itself."

[lib]
crate-type = ["rlib"]

[dependencies]
grafting-graph-core = { path = "../../../graph/core" }
# Seeded jitter for `cell_partition`'s bisection splits -- `default-features
# = false` on both skips `getrandom`/OS entropy entirely, since a seed
# always comes from the caller (same UX as
# `TerrainBrushParams.seed`/`RoomStampParams.seed`).
rand = { version = "0.8", default-features = false }
rand_pcg = { version = "0.3", default-features = false }
