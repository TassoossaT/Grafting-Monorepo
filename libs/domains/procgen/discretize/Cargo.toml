[package]
name = "grafting-procgen-discretize"
version = "0.0.0"
edition = "2024"
publish = false
description = "Wasm bridge discretizing an arbitrary continuous [-1.0, 1.0] float array into N discrete integer levels via linear binning, as a generic, shareable domain capability. Not terrain-specific -- any continuous signal (heightmap, data-viz bucketing, LOD, posterization) can consume it."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
