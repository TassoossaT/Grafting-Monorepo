[package]
name = "grafting-procgen-terrain-generation"
version = "0.0.0"
edition = "2024"
publish = false
description = "Derives ADR-0022 construction-surface node cycles from a WFC-chosen terrain module and a PrismGridMesh cell. Generation-only: produces Node/Edge/SurfaceSpec data, never mutates a graph or registry itself."

[lib]
crate-type = ["rlib"]

[dependencies]
grafting-graph-core = { path = "../../../graph/core" }
grafting-procgen-tileset-wfc = { path = "../tileset-wfc", default-features = false }
