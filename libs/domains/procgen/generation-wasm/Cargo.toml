[package]
name = "grafting-procgen-generation-wasm"
version = "0.0.0"
edition = "2024"
publish = false
description = "Wasm bridge exposing a small, real procedural-generation slice (noise-backed heightmap) as a generic, shareable domain capability, currently exercised by Architecture Studio's generation-test surface; not the full Townscaper-style generation pipeline."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
noise = "0.9"
getrandom = { version = "0.2", features = ["js"] }
grafting-graph-core = { path = "../../../graph/core" }

