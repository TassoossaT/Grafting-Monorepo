packages:
  - "apps/*"
  - "libs/**"
  - "packages/*"
  - "tools/*"
allowBuilds:
  # Vite works through esbuild's platform package without its install script.
  # Keep dependency scripts denied unless separately reviewed and approved.
  esbuild: false
  nx: true
  sharp: set this to true or false
overrides:
  # SECURITY-001: nx's own dependency tree still resolves these two
  # transitively; nx 23.1.0 is the latest stable release (23.2.0 only
  # has beta/canary builds), so forcing the patched versions here is the
  # real fix rather than waiting on an unstable Nx bump. Re-check when a
  # newer stable Nx ships and drop the override if it no longer needs it.
  axios: "^1.18.1"
  brace-expansion: "^5.0.8"
