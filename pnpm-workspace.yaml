packages:
  - "apps/*"
  - "libs/**"
  - "packages/*"
  - "tools/*"
# Both workspace Wasm packages invoke wasm-pack during postinstall. Their
# shared Cargo/wasm-pack caches are not safe to mutate concurrently on Windows.
childConcurrency: 1
# Nx targets may call pnpm-owned package scripts, but they must not turn a
# normal `nx ...` invocation into an implicit dependency installation.
verifyDepsBeforeRun: warn
allowBuilds:
  # Vite works through esbuild's platform package without its install script.
  # Keep dependency scripts denied unless separately reviewed and approved.
  esbuild: false
  nx: true
  # Transitive via next (apps/architecture-studio) for its Image Optimization
  # feature. sharp's install script only compiles/downloads a prebuilt
  # libvips binary for image processing -- no network access beyond that
  # fetch, maintained by libvips' own author (lovell), and this exact
  # unresolved placeholder ("set this to true or false") was leaving
  # `pnpm install --frozen-lockfile` failing in CI with
  # ERR_PNPM_IGNORED_BUILDS instead of actually deciding anything.
  sharp: true
overrides:
  # SECURITY-001: nx's own dependency tree still resolves these two
  # transitively; nx 23.1.0 is the latest stable release (23.2.0 only
  # has beta/canary builds), so forcing the patched versions here is the
  # real fix rather than waiting on an unstable Nx bump. Re-check when a
  # newer stable Nx ships and drop the override if it no longer needs it.
  axios: "^1.18.1"
  brace-expansion: "^5.0.8"
